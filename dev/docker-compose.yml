services:
  db:
    image: mariadb:10.6
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: dev
      MARIADB_ROOT_HOST: '%'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command: >
      --max_allowed_packet=256M

volumes:
  mysql-data:
