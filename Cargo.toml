[package]
name = "crackstation-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["limit", "load-shed"] }
tower-http = { version = "0.6", features = ["fs", "catch-panic"] }

# Templating (compile-time checked)
askama = "0.12"
askama_axum = "0.4"

# Database
sqlx = { version = "0.8.1", features = ["runtime-tokio-rustls", "mysql"] }

# Hash lookups
preimage = { version = "0.1.2", default-features = false }

# HTTP client (for reCAPTCHA verification)
reqwest = { version = "0.12", features = ["json"] }

# Crypto (for phpcount SHA256)
sha2 = "0.10"
hmac = "0.12"
rand = { version = "0.10", features = ["sys_rng"] }
hex = "0.4"

# Serialization (for reCAPTCHA response)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

# Error handling
anyhow = "1"

# Misc
bytes = "1"
libc = "0.2"
form_urlencoded = "1"

# Constant-time comparison for captcha bypass secret
subtle = "2.6"

[build-dependencies]
glob = "0.3"

[dev-dependencies]
tempfile = "3"

# Integer overflow panics in release instead of wrapping silently. The default release
# profile turns these off, which is the one form of silent failure this codebase would
# otherwise ship: a wrapped index calculation surfaces as a wrong "Not found" or a wrong
# plaintext, with nothing in the log.
#
# Costs nothing measurable here. The server hashes roughly twenty candidate words per
# request to confirm matches; the bulk hashing is index building, which runs from the
# preimage CLI built out of preimage's own workspace, where this setting does not apply.
#
# No `debug` here on purpose. Cargo applies only the top-level profile, so preimage's
# `debug = true` never reached this build anyway, and debuginfo belongs in a build you
# are debugging rather than in the deployed artifact.
[profile.release]
overflow-checks = true

# TEMPORARY -- DELETE THE MOMENT preimage 0.1.2 IS PUBLISHED.
#
# The per-hash match limit (PreimageOracle::crack_with_limit) does not exist in the
# published 0.1.1, so this builds against the sibling checkout until then. A production
# build will fail outright with this here, because /storage holds no ../preimage -- that
# is deliberate. A loud failure at build time is the right outcome for "the crate this
# depends on has not been released yet"; the alternative is shipping a server built from
# whatever happens to be next to it.
[patch.crates-io]
preimage = { path = "../preimage/preimage" }
